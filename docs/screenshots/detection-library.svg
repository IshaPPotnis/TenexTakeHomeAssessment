<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Logline detection library</title>
  <desc id="description">The Logline detection library showing the global failed-login rule with its matching expression and read-only status.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#1b2b42"/>
      <stop offset=".58" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#18263a"/>
      <stop offset="1" stop-color="#141f31"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#background)"/>
  <g font-family="Arial, sans-serif">
    <rect x="125" y="42" width="34" height="34" rx="10" fill="#c0f56c"/>
    <text x="142" y="66" text-anchor="middle" fill="#142019" font-size="21" font-weight="700">L</text>
    <text x="170" y="66" fill="#f3f6fa" font-size="21" font-weight="700">Logline<tspan fill="#c0f56c">.</tspan></text>
    <text x="825" y="64" fill="#c0cad8" font-family="monospace" font-size="12">admin-dev</text>
    <rect x="900" y="44" width="84" height="32" rx="7" fill="#1a283b" stroke="#35445a"/>
    <text x="942" y="65" text-anchor="middle" fill="#c0cad8" font-size="12">Log out</text>
    <circle cx="1010" cy="60" r="4" fill="#c0f56c"/>
    <text x="1022" y="64" fill="#a4b0c1" font-family="monospace" font-size="10" letter-spacing="1">PROCESSOR API</text>
    <line x1="125" y1="96" x2="1075" y2="96" stroke="#28374d"/>
    <text x="125" y="142" fill="#c0f56c" font-family="monospace" font-size="11" letter-spacing="2">OBSERVABILITY TOOLKIT / INGESTION</text>
    <text x="125" y="205" fill="#eaf0f8" font-size="52" font-weight="700">Make logs readable</text>
    <text x="127" y="237" fill="#9aa8bb" font-size="15">Parse log batches with saved definitions, or manage the parsers in your library.</text>

    <rect x="125" y="269" width="596" height="44" rx="9" fill="#121d2e" stroke="#29384d"/>
    <text x="222" y="296" text-anchor="middle" fill="#8998ad" font-size="12">Process logs</text>
    <text x="414" y="296" text-anchor="middle" fill="#8998ad" font-size="12">Parser library</text>
    <rect x="520" y="283" width="20" height="18" rx="9" fill="#c0f56c18"/>
    <text x="530" y="296" text-anchor="middle" fill="#c0f56c" font-family="monospace" font-size="10">4</text>
    <rect x="548" y="274" width="166" height="34" rx="6" fill="#202f44" stroke="#34445a"/>
    <text x="628" y="296" text-anchor="middle" fill="#e7edf7" font-size="12" font-weight="600">Detection library</text>
    <rect x="697" y="283" width="20" height="18" rx="9" fill="#c0f56c18"/>
    <text x="707" y="296" text-anchor="middle" fill="#c0f56c" font-family="monospace" font-size="10">1</text>

    <rect x="125" y="335" width="950" height="374" rx="14" fill="url(#panel)" stroke="#2b3a50"/>
    <text x="157" y="369" fill="#c0f56c" font-family="monospace" font-size="10" letter-spacing="1.5">03 — INCIDENT RULES</text>
    <text x="157" y="398" fill="#eaf0f8" font-size="19" font-weight="600">Detection library</text>
    <rect x="920" y="355" width="123" height="36" rx="7" fill="#1a283b" stroke="#35445a"/>
    <text x="981" y="378" text-anchor="middle" fill="#c0cad8" font-size="12"><tspan fill="#c0f56c">＋</tspan> New rule</text>
    <text x="157" y="427" fill="#8290a6" font-size="12">Create and maintain rules for identifying incidents in your logs.</text>

    <rect x="157" y="453" width="886" height="228" rx="9" fill="#101a2a88" stroke="#2b3a50"/>
    <text x="179" y="485" fill="#e7edf7" font-size="15" font-weight="600">Failed Login attempt</text>
    <text x="179" y="509" fill="#aab7c9" font-family="monospace" font-size="11">ID 1000 · GLOBAL</text>
    <rect x="936" y="469" width="82" height="28" rx="6" fill="#1a283b" stroke="#35445a"/>
    <text x="977" y="488" text-anchor="middle" fill="#8290a6" font-size="10">Read only</text>
    <rect x="179" y="529" width="842" height="42" rx="6" fill="#0c1523" stroke="#29384d"/>
    <text x="195" y="555" fill="#c0f56c" font-family="monospace" font-size="12">EventID=4625 AND Channel=Security</text>
    <text x="179" y="599" fill="#c0cad8" font-size="12">Detects failed login attempts in the Security channel</text>
    <text x="179" y="619" fill="#c0cad8" font-size="12">(Windows Event ID 4625).</text>
    <rect x="179" y="643" width="842" height="1" fill="#29384d"/>
    <circle cx="190" cy="661" r="4" fill="#c0f56c"/>
    <text x="204" y="665" fill="#aab7c9" font-size="11">Global rules are available to all customers and cannot be edited here.</text>
    <text x="125" y="738" fill="#68778c" font-family="monospace" font-size="9" letter-spacing="1">LOGLINE UI</text>
    <text x="1075" y="738" text-anchor="end" fill="#68778c" font-family="monospace" font-size="9" letter-spacing="1">CONNECTED TO YOUR LOCAL API</text>
  </g>
</svg>
